<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>прокачка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* layout: одна мобильная колонка, синяя "обложка" сверху как в рабочей тетради, белые листы-карточки, нижняя навигация */
:root{
  --bg:#E8F1FC; --bg-deep:#D6E6F9;
  --panel:#3373CF; --panel-2:#2A64BD; --panel-ink:#FFFFFF; --panel-soft:rgba(255,255,255,.18); --panel-line:rgba(255,255,255,.28);
  --card:#FFFFFF; --ink:#14315F; --muted:#5B7298; --muted-bg:#2F4A78; --line:#D7E4F6; --chip:#E9F1FC;
  --navy:#1C3F7E; --navy-ink:#FFFFFF; --accent:#3373CF; --accent-ink:#FFFFFF;
  --good:#1E8F62; --warn:#C9741F; --coin:#FFFFFF; --shade:rgba(20,49,95,.5); --dash:rgba(51,115,207,.45);
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1830; --bg-deep:#091327;
  --panel:#1F56B5; --panel-2:#1A4A9D; --panel-ink:#FFFFFF; --panel-soft:rgba(255,255,255,.14); --panel-line:rgba(255,255,255,.22);
  --card:#122546; --ink:#E5EEFC; --muted:#93A9CE; --muted-bg:#A9BDDD; --line:#223A63; --chip:#1A3259;
  --navy:#0D1D3B; --navy-ink:#E5EEFC; --accent:#6EA3F6; --accent-ink:#0B1830;
  --good:#45C08E; --warn:#F0A256; --coin:#EEF3FB; --shade:rgba(0,0,0,.62); --dash:rgba(110,163,246,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1830; --bg-deep:#091327;
  --panel:#1F56B5; --panel-2:#1A4A9D; --panel-ink:#FFFFFF; --panel-soft:rgba(255,255,255,.14); --panel-line:rgba(255,255,255,.22);
  --card:#122546; --ink:#E5EEFC; --muted:#93A9CE; --muted-bg:#A9BDDD; --line:#223A63; --chip:#1A3259;
  --navy:#0D1D3B; --navy-ink:#E5EEFC; --accent:#6EA3F6; --accent-ink:#0B1830;
  --good:#45C08E; --warn:#F0A256; --coin:#EEF3FB; --shade:rgba(0,0,0,.62); --dash:rgba(110,163,246,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
/* серый текст прямо на голубом фоне страницы: контраст не ниже 4.5:1 */
.sec .muted,.sec .link,.day,.day .muted,.group-h,.glabel,.wrap>.muted,.wrap>p.muted,#achSec>p.muted,.addrow+.row .muted,.skills-grp,.sg-h{color:var(--muted-bg)}
.sec .link{opacity:1}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:110px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;white-space:nowrap;letter-spacing:0;text-transform:none;color:var(--muted-bg);margin-top:3px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);color:var(--ink);flex:none}
.iconbtn svg{width:20px;height:20px}
.sync{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sync i{width:14px;height:14px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--good)}.sync.local i{background:var(--warn)}.sync.error i{background:#D64545}.sync.syncing i{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

/* hero panel */
.hero{background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-50px;width:220px;height:220px;border-radius:50%;background:var(--panel-2);opacity:.7;pointer-events:none}
.hero>*{position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:var(--navy-ink);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.pill.soft{background:var(--panel-soft);color:var(--panel-ink)}
.big{font-family:var(--f-display);font-weight:700;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.hero .big{font-size:clamp(46px,14vw,58px);margin-top:10px}
.rank{font-size:15px;font-weight:600;margin-top:6px;opacity:.95}
.xpbar{height:16px;border-radius:999px;background:var(--panel-soft);margin-top:14px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:999px;background:var(--panel-ink);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.xpmeta{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat{display:inline-flex;align-items:center;gap:6px;background:var(--panel-soft);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:600}
.stat svg{width:16px;height:16px}
.hero .q{background:var(--panel-soft);color:var(--panel-ink)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* section title — рамка выделения, как в тетради */
.sec{margin-top:32px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-l{display:flex;align-items:center;gap:8px;min-width:0}
.sel{position:relative;display:inline-block;font-weight:700;font-size:15px;background:var(--card);color:var(--ink);padding:3px 9px;border:1.5px solid var(--accent);border-radius:2px}
.nextgoal{margin-top:14px}
.ng-t{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted)}
.ng-h{font-size:17px;margin:4px 0 10px}
.xpbar.sm{height:10px;margin-top:0;background:var(--chip)}.xpbar.sm i{background:var(--accent)}
.sel.plain{border:0;background:transparent;padding:0;font-size:18px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
.sel.plain::before,.sel.plain::after{display:none}
.sel-b{display:inline-flex;align-items:center;gap:6px;font-family:inherit;cursor:pointer;text-align:left}
.sel-b svg{width:16px;height:16px;flex:none;opacity:.55}
.sel::before,.sel::after{content:"";position:absolute;width:6px;height:6px;background:var(--card);border:1.5px solid var(--accent)}
.sel::before{left:-4px;top:-4px}.sel::after{right:-4px;bottom:-4px}
.q{flex:none;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);color:var(--accent);font-weight:700;font-size:13px;line-height:1;border:1.5px solid var(--line)}
.link{font-size:13px;font-weight:600;color:var(--ink);opacity:.85;text-decoration:underline;text-underline-offset:3px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.card{background:var(--card);border-radius:18px;padding:14px 15px;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:13px}
.warnbox{background:var(--warn);color:#fff;border-radius:16px;padding:12px 14px;font-size:14px;margin-top:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px;background:var(--navy);color:var(--navy-ink);text-align:center}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chip.sec2[aria-pressed="true"]{background:var(--card);border-color:var(--accent);color:var(--ink)}
.tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:13px;font-weight:600;background:var(--chip);color:var(--ink)}
.tag.navy{background:var(--navy);color:var(--navy-ink)}
.tag.good{background:var(--good);color:#fff}
.tag.warn{background:var(--warn);color:#fff}

/* skills */
.grp{font-family:var(--f-display);font-weight:500;text-transform:uppercase;font-size:13px;letter-spacing:.05em;color:var(--muted-bg);margin-top:4px}
.skill{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.skill .nm{font-weight:600;font-size:14px;min-width:0}
.skill .lv{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.segs{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:5px}
.segs i{height:8px;border-radius:3px;background:var(--chip)}
.segs i.on{background:var(--accent)}
.segs i.part{background:linear-gradient(90deg,var(--accent) var(--p),var(--chip) var(--p))}

/* state icons */
.need{display:flex;flex-direction:column;gap:8px}
.need-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.need-h b{font-size:14px}
.need-h span{font-size:13px;color:var(--muted)}
.need3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.needb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:14px;background:var(--chip);color:var(--muted-bg);border:1.5px solid transparent;text-align:center;min-height:88px}
.needb .ni svg{width:28px;height:28px}
.needb b{font-size:13px;color:var(--ink)}
.needb .nv{font-size:13px;line-height:1.15}
.needb:not(.set) .ni{opacity:.55}
.needb.set{color:var(--accent)}
.needb.open{border-color:var(--accent);background:var(--card)}
#needsCard .icons5{margin-top:12px}
.icons5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.icons5 button{height:52px;border-radius:14px;background:var(--chip);color:var(--muted);display:grid;place-items:center;border:1.5px solid transparent}
.icons5 button svg{width:30px;height:30px}
.icons5 button.on{background:var(--accent);color:var(--accent-ink)}
.icons5 button.past{color:var(--accent)}

/* entries */
.entry{display:flex;flex-direction:column;gap:6px}
.entry .t{font-weight:600}
.entry .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.entry .xp{margin-left:auto;font-weight:700;font-size:13px;color:var(--accent);white-space:nowrap}
.entry img{border-radius:12px;max-height:220px;object-fit:cover;width:100%}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:9px}
.day{font-family:var(--f-display);font-weight:500;text-transform:uppercase;font-size:14px;letter-spacing:.04em;color:var(--ink);opacity:.8;margin-top:14px}

.remind{background:var(--navy);color:var(--navy-ink);border-radius:18px;padding:14px 15px;display:flex;gap:12px;align-items:flex-start}
.remind svg{flex:none;width:22px;height:22px;margin-top:2px}

/* quest */
.quest{display:flex;flex-direction:column;gap:8px}
.quest.boss{background:var(--panel);color:var(--panel-ink)}
.quest.boss .muted{color:var(--panel-ink);opacity:.8}
.quest.boss .tag{background:var(--panel-soft);color:var(--panel-ink)}
.quest .qt{font-weight:600;font-size:15.5px}
.goal-step{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--accent);display:grid;place-items:center}
.check.on{background:var(--accent);color:var(--accent-ink)}
.check svg{width:15px;height:15px}

/* wishlist */
.coin{width:16px;height:16px;border-radius:50%;background:var(--coin);display:inline-block;flex:none;box-shadow:inset 0 0 0 1.5px rgba(51,115,207,.45),inset 0 0 0 4px var(--coin),inset 0 0 0 5px rgba(51,115,207,.2)}
.price{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.wish-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.wish{background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.wish .ph{aspect-ratio:4/5;max-width:100%;background:var(--chip);position:relative;display:grid;place-items:center;color:var(--muted)}
.wish .ph{background-repeat:no-repeat}
.wish .ph.noimg{aspect-ratio:auto;height:72px}
.wish .ph.noimg>svg{width:28px;height:28px;color:var(--accent)}
.wish-new{align-items:center;justify-content:center;min-height:200px;border:1.5px dashed var(--line);background:transparent;color:var(--ink);font-weight:600;gap:6px}
.ideas summary{font-weight:600;cursor:pointer}
.wish .ph .ini{font-family:var(--f-display);font-weight:700;font-size:44px;color:var(--accent);text-transform:uppercase}
.wish .ph .edit{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:10px;background:var(--card);color:var(--ink);display:grid;place-items:center;font-size:14px}
.wish .bd{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.wish .ti{font-weight:600;font-size:14px;line-height:1.25}
.prog{height:6px;border-radius:9px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--panel)}
.wish .btn{margin-top:auto}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.ach{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ach .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--chip);color:var(--muted-bg);font-family:var(--f-display);font-weight:700;font-size:19px}
.ach.on .ic{background:var(--accent);color:var(--accent-ink)}
.ach .an{font-size:13px;font-weight:600;line-height:1.2}
.ach .ad{font-size:13px;color:var(--muted);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ach:not(.on) .ic{opacity:.7}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin-top:4px}
.seg button{border-radius:10px;padding:9px 6px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.ratio{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--chip);margin-top:8px}
.ratio i{display:block;height:100%}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp td,table.cmp th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.cmp th{font-size:13px;color:var(--muted);font-weight:600}
table.cmp td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.delta{color:var(--good)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:13px;font-weight:600;color:var(--muted);border-radius:12px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}

/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:28px;margin:4px 0 12px;line-height:1}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.in-text{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.in-text:focus{border-color:var(--accent)}
textarea.in-text{min-height:84px;resize:vertical}
.xpprev{position:sticky;bottom:0;margin-top:16px;background:var(--bg);padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.xpprev b{font-family:var(--f-display);font-size:24px}
details summary{cursor:pointer;font-weight:600;font-size:14px;margin-top:16px}
.toggle{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:500}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.imgpick{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;border-radius:16px;background:var(--card);border:1.5px dashed var(--line);overflow:hidden;position:relative;cursor:pointer;color:var(--muted);font-weight:600}
.imgpick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* toast + levelup */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:95;background:var(--navy);color:var(--navy-ink);
  padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18);animation:up .25s}
.lvlup{position:fixed;inset:0;z-index:90;background:var(--panel);color:var(--panel-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.lvlup .big{font-size:clamp(64px,22vw,120px)}
.lvlup .burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lvlup .burst i{position:absolute;width:10px;height:18px;border-radius:3px;background:var(--panel-ink);opacity:.8;animation:fall 2.2s linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
.lvlup .pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

.xptable{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:8px}
.xptable b{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:26px 16px}
.ghost-v{opacity:.38;pointer-events:none;user-select:none;margin-top:12px;display:grid;gap:8px;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.ghost-v .g{background:var(--card,#fff);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.ghost-v .g b{font-family:Oswald,sans-serif;font-size:30px;color:var(--panel);min-width:30px}
.ghost-v .g i{display:block;height:8px;border-radius:5px;background:var(--chip)}
.ghost-v .g .bar{height:6px;border-radius:9px;background:var(--chip);overflow:hidden;margin-top:8px}
.ghost-v .g .bar u{display:block;height:100%;background:var(--panel);border-radius:9px}
.ghost-v .gd{font-size:13px;color:var(--muted);padding:2px 4px}
.empty .big{font-size:26px}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* обучение: подсветка живого интерфейса */
.tour{position:fixed;inset:0;z-index:80;pointer-events:none}
.tour .blk{position:fixed;background:transparent;pointer-events:auto}
.tour .hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px var(--shade);outline:3px solid var(--panel-ink);outline-offset:3px;transition:all .25s ease;pointer-events:none}
.tour .hole.tap{animation:pulse 1.4s ease-in-out infinite}
.tour .hole.none{width:0!important;height:0!important;outline:0}
@keyframes pulse{0%,100%{outline-color:var(--panel-ink)}50%{outline-color:var(--accent)}}
.tour .tip{position:fixed;pointer-events:auto;background:var(--card);color:var(--ink);border-radius:18px;padding:14px 15px;box-shadow:0 12px 32px rgba(0,0,0,.25);width:min(360px,calc(100vw - 32px));transition:top .25s ease,left .25s ease}
.tour .tip h3{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:20px;margin:6px 0 6px;line-height:1.05}
.tour .tip p{margin:0;font-size:14.5px}
.tour .tip .do{margin-top:10px;font-weight:700;color:var(--accent);font-size:14px}
.tour .tip .ok{margin-top:10px;font-weight:700;color:var(--good);font-size:14px}
.cropbox{width:100%;max-width:100%;border-radius:16px;background-color:var(--chip);touch-action:none;cursor:grab;outline:2px solid var(--accent);outline-offset:2px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gi .th{aspect-ratio:4/5;max-width:100%;border-radius:12px;background-color:var(--chip);position:relative}
.gi .cov{position:absolute;left:6px;top:6px}
.gi-b{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.gi-b .btn{padding:5px 8px;font-size:13px;border-radius:9px}
.wish .ph[data-act]{cursor:zoom-in}
.wish .ph .cnt{position:absolute;left:8px;bottom:8px;background:var(--card)}
button.ach{border:0;font:inherit;color:inherit;cursor:pointer}
.wish>svg,.ach .ic svg{width:26px;height:26px;flex:none}
.ach .ic{background-color:var(--chip);background-repeat:no-repeat}
/* сделано / в планах: один цвет, разная плотность */
.entry-row{display:flex;gap:12px;align-items:flex-start}
.entry-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.st-mark{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin-top:-2px}
.st-mark svg{width:16px;height:16px}
.is-done .st-mark{background:var(--accent);color:var(--accent-ink)}
.is-plan{background:transparent;border:2px dashed var(--dash);box-shadow:none}
.is-plan .st-mark{border:2px dashed var(--accent);background:transparent;cursor:pointer}
.is-plan .st-mark:hover{background:var(--chip)}
.is-plan .t{opacity:.85}
.is-plan .tag{background:transparent;border:1.5px solid var(--dash)}
.is-plan .tag.good,.is-plan .tag.warn{border:0}

/* игровая карточка квеста: все оттенки одного синего */
.qcard{position:relative;border-radius:20px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;
  background:var(--panel);color:var(--panel-ink)}
.qcard::before,.qcard::after{content:"";position:absolute;width:16px;height:16px;border:3px solid var(--panel-ink);opacity:.55}
.qcard::before{left:8px;top:8px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.qcard::after{right:8px;bottom:8px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.qcard.q-day{background:var(--card);color:var(--ink);border:2px solid var(--accent)}
.qcard.q-day::before,.qcard.q-day::after{border-color:var(--accent)}
.qcard.q-month{background:var(--navy);color:var(--navy-ink)}
.qcard.q-closed{opacity:.6}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.q-badge{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;padding:4px 10px;border-radius:8px;background:var(--panel-soft)}
.q-day .q-badge{background:var(--chip)}
.q-stars{display:flex;gap:2px}
.q-stars span{width:18px;height:18px;opacity:.3}
.q-stars span.on{opacity:1}
.q-stars svg{width:100%;height:100%}
.q-title{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:24px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.q-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:14px;font-weight:600}.q-meta .dot{opacity:.5}.q-meta .pips,.q-meta .tbar{margin-left:auto}
.q-skill{font-size:13px;opacity:.8;margin-top:-4px}
.hp{display:flex;flex-direction:column;gap:5px}
.hp-l{display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:.9}
.hp-bar{display:flex;gap:4px;height:8px}
.hp-bar i{flex:1;border-radius:4px;background:currentColor;opacity:.2}
.hp-bar i.on{background:currentColor;opacity:1}
.q-steps{display:flex;flex-direction:column;gap:6px}
.q-step{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:12px;background:var(--panel-soft);color:inherit;font-size:14px}
.q-day .q-step{background:var(--chip)}
.q-step.done span:last-child{text-decoration:line-through;opacity:.6}
.q-box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid currentColor;display:grid;place-items:center}
.q-step.done .q-box{background:currentColor}
.q-step.done .q-box svg{color:var(--panel)}
.q-day .q-step.done .q-box svg{color:var(--card)}
.q-month .q-step.done .q-box svg{color:var(--navy)}
.q-box svg{width:14px;height:14px}
.q-time{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:3px;border:1.5px solid currentColor;opacity:.9}
.pips i.gone{opacity:.25;background:currentColor}
.pips i.now{background:currentColor;opacity:1}
.tbar{flex:1;max-width:160px;height:8px;border-radius:9px;background:var(--panel-soft);overflow:hidden}
.tbar i{display:block;height:100%;background:currentColor;opacity:.6}
.q-loot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;padding:8px 10px;border-radius:12px;border:1.5px dashed currentColor}
.q-loot .q-chest{width:22px;height:22px}
.q-loot .q-chest svg{width:100%;height:100%}
.q-moved{opacity:.75;margin-left:auto}
.q-btns{gap:8px;flex-wrap:nowrap}
.q-btns .btn{min-height:48px;height:48px}.q-main{flex:1}.q-more{width:48px;padding:0;font-size:22px;line-height:1;flex:none}
.q-main{background:var(--panel-ink);color:var(--panel)}
.q-day .q-main{background:var(--accent);color:var(--accent-ink)}
.q-month .q-main{background:var(--navy-ink);color:var(--navy)}
.q-sec{background:var(--panel-soft);color:inherit}
.q-day .q-sec{background:var(--chip)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

  cache(){try{localStorage.setItem(LS_P,JSON.stringify(S.profile));localStorage.setItem(LS_E,JSON.stringify(S.entries));this.lsOk=true}catch(x){this.lsOk=false}},
  setStatus(st,err){this.status=st;this.err=err||"";paintSync()},
  async connect(){
    if(!CS){this.setStatus("local",TG?"телеграм у тебя устаревший, обнови приложение, чтобы данные хранились в облаке.":"это обычный браузер, данные хранятся только на этом устройстве. открой приложение через бота в телеграме.");return}
    this.setStatus("syncing");
    try{
      const keys=await this.keysAll();
      const nKeys=keys.filter(k=>k.endsWith("_n"));const meta=await cs.get(nKeys);
      nKeys.forEach(k=>{this.counts[k.slice(0,-2)]=+meta[k]||0});
      const want=[];Object.entries(this.counts).forEach(([pre,n])=>{for(let i=0;i<n;i++)want.push(pre+"_"+i)});
      const vals=await cs.get(want);
      const blob=pre=>{const n=this.counts[pre]||0;let s="";for(let i=0;i<n;i++)s+=vals[pre+"_"+i]||"";return s};
      Object.keys(this.counts).filter(p=>p[0]==="i").forEach(p=>{const rid=p.slice(1);IMG[rid]=blob(p);imgSaved.add(rid)});
      let rp=null;if(this.counts.p){try{rp=JSON.parse(blob("p"))}catch(x){}}
      let re=[];Object.keys(this.counts).filter(p=>/^e\d{6}$/.test(p)).forEach(p=>{try{re=re.concat(JSON.parse(blob(p)))}catch(x){}});
      unpackImgs(S.profile);S.entries.forEach(unpackImgs);
      if(rp)this.mergeProfile(unpackImgs(rp));else this.mark("p");
      this.mergeEntries(re.map(unpackImgs));
      this.ready=true;refresh();
      await this.flush();
    }catch(x){this.setStatus("error","не получилось связаться с облаком телеграма. всё сохранено на телефоне, попробую ещё раз.");clearTimeout(this.retryT);this.retryT=setTimeout(()=>this.connect(),8000)}
  },
  async keysAll(){return cs.keys()},
  mark(k){this.dirty.add(k);if(!this.ready&&CS)return;clearTimeout(this.qT);this.qT=setTimeout(()=>this.flush(),700)},
  mergeProfile(r){
    const L=S.profile;const ru=r.upd||0,lu=L.upd||0;
    if(L.fresh||ru>lu){S.profile=normalize(r);S.profile.fresh=false;this.cache();return true}
    if(lu>ru)this.mark("p");return false;
  },
  mergeEntries(arr){
    let changed=false;const map=new Map(S.entries.map(e=>[e.id,e]));const seen=new Set();
    arr.forEach(r=>{if(!r||!r.id)return;seen.add(r.id);const l=map.get(r.id);const ru=r.upd||r.ts||0,lu=l?(l.upd||l.ts||0):-1;
      if(!l||ru>lu){if(l&&bucketOf(l.date)!==bucketOf(r.date))this.mark(bucketOf(l.date));map.set(r.id,r);changed=true}else if(lu>ru){this.mark(bucketOf(l.date));this.mark(bucketOf(r.date))}});
    map.forEach((e,id)=>{if(!seen.has(id))this.mark(bucketOf(e.date))});
    if(changed){S.entries=[...map.values()];this.cache()}
    return changed;
  },
  async writeBlob(pre,str){
    const n=Math.max(1,Math.ceil(str.length/CH));const old=this.counts[pre]||0;
    for(let i=0;i<n;i++)await cs.set(pre+"_"+i,str.slice(i*CH,(i+1)*CH));
    await cs.set(pre+"_n",String(n));
    const extra=[];for(let i=n;i<old;i++)extra.push(pre+"_"+i);if(extra.length)await cs.del(extra);
    this.counts[pre]=n;
  },
  async flush(){
    if(!CS||!this.ready||this.flushing)return;this.flushing=true;
    if(this.dirty.size)this.setStatus("syncing");
    try{
      while(this.dirty.size){
        const k=this.dirty.values().next().value;this.dirty.delete(k);
        let str;
        if(k==="p")str=JSON.stringify(packImgs(S.profile));
        else str=JSON.stringify(packImgs(S.entries.filter(e=>bucketOf(e.date)===k)));
        // новые фото
        for(const rid of Object.keys(IMG))if(!imgSaved.has(rid)&&IMG[rid]){await this.writeBlob("i"+rid,IMG[rid]);imgSaved.add(rid)}
        await this.writeBlob(k,str);
      }
      this.lastSync=Date.now();
      const used=Object.values(this.counts).reduce((a,n)=>a+n+1,0);
      this.setStatus("cloud",used>900?"облако телеграма почти заполнено ("+used+" из 1024 ячеек). удали старые фото или сделай резервную копию.":"");
    }catch(x){this.setStatus("error","облако телеграма не ответило. всё сохранено на телефоне, отправлю позже.");clearTimeout(this.retryT);this.retryT=setTimeout(()=>{this.flushing=false;this.flush()},8000);this.flushing=false;return}
    this.flushing=false;
    if(this.dirty.size)this.flush();
  },
  saveProfile(){S.profile.upd=Date.now();S.profile.fresh=false;this.cache();this.mark("p")},
  putEntry(e){e.upd=Date.now();if(!e.ts)e.ts=e.upd;const i=S.entries.findIndex(x=>x.id===e.id);if(i>=0){const old=S.entries[i];if(bucketOf(old.date)!==bucketOf(e.date))this.mark(bucketOf(old.date));S.entries[i]=e}else S.entries.push(e);this.cache();this.mark(bucketOf(e.date))},
  delEntry(id){const e=S.entries.find(x=>x.id===id);if(!e)return;e.del=true;e.upd=Date.now();this.cache();this.mark(bucketOf(e.date))}
};

/* ================= расчёты ================= */
const xpOf=e=>{if(e.type==="bonus")return e.xp||25;const t=TY[e.type];if(!t)return 0;return Math.round(t.xp*(e.first?FIRST_MULT:1)+(e.fear?FEAR_XP:0))};
const coinsOf=x=>Math.round(x/10);
const skillCum=L=>30*L*(L-1);
function skillLevel(total){let L=1;while(L<10&&skillCum(L+1)<=total)L++;const cur=skillCum(L),nxt=L<10?skillCum(L+1):cur;return{level:L,into:total-cur,need:nxt-cur,frac:L<10?(total-cur)/(nxt-cur):1}}
const seasonCum=n=>{let s=0;for(let k=1;k<n;k++)s+=100+40*(k-1);return s};
function seasonLevel(xp){let L=1;while(seasonCum(L+1)<=xp)L++;const cur=seasonCum(L),nxt=seasonCum(L+1);return{level:L,into:xp-cur,need:nxt-cur,frac:(xp-cur)/(nxt-cur)}}
const rankOf=L=>{let r=RANKS[0][1];RANKS.forEach(([l,n])=>{if(L>=l)r=n});return r};
function streakOf(done){
  const days=new Set(done.map(e=>e.date));const t=today();
  if(!days.size)return{cur:0,best:0,freezes:0,activeToday:false};
  const first=[...days].sort()[0];let cur=0,best=0,fr=0,run=0;
  for(let d=first;d<=t;d=addDays(d,1)){
    if(days.has(d)){cur++;run++;if(run===7){fr=Math.min(3,fr+1);run=0}}
    else if(d===t){}
    else if(cur>0&&fr>0){fr--}
    else{cur=0;run=0}
    best=Math.max(best,cur);
  }
  return{cur,best,freezes:fr,activeToday:days.has(t)};
}
function derive(upTo){
  const P=S.profile;const lim=upTo||"9999";
  const done=live().filter(e=>!e.planned&&e.date<=lim);
  const sx={};allSkills().forEach(s=>sx[s.id]=0);
  let season=0,coins=0,fear=0;const byType={bonus:0};TYPES.forEach(t=>byType[t.id]=0);
  const bySkill={};
  done.forEach(e=>{const x=xpOf(e);byType[e.type]=(byType[e.type]||0)+1;if(e.fear)fear++;if(e.primary)bySkill[e.primary]=(bySkill[e.primary]||0)+1;
    if(e.primary&&sx[e.primary]!=null)sx[e.primary]+=x;
    (e.secondary||[]).forEach(id=>{if(sx[id]!=null)sx[id]+=Math.round(x*SEC_SHARE)});
    if(e.date>=P.seasonStart){season+=x;coins+=coinsOf(x)}});
  let bossDone=0;
  P.challenges.forEach(c=>{const at=c.doneAt||"";if(at>lim)return;
    if(c.status==="done"){season+=c.xp;coins+=c.coins;if(sx[c.skill]!=null)sx[c.skill]+=c.xp;if(c.period==="month")bossDone++}
    if(c.status==="reviewed"){season+=10;coins+=1}});
  P.goals.forEach(g=>(g.steps||[]).forEach(st=>{if(st.done&&(st.doneAt||"")<=lim){season+=40;coins+=4}}));
  let spent=0;P.purchases.forEach(p=>{if(p.at<=lim)spent+=p.price});
  const skills={};allSkills().forEach(s=>{const base=skillCum(P.startLevels[s.id]||1);skills[s.id]=Object.assign({xp:sx[s.id]},skillLevel(base+sx[s.id]))});
  const lv=seasonLevel(season);
  const d={done,skills,season,coins:coins-spent,earned:coins,byType,fear,bossDone,purchases:P.purchases.length,streak:streakOf(done),level:lv.level,lv};
  d.bySkill=bySkill;d.questsDone=P.challenges.filter(c=>c.status==="done"&&(c.doneAt||"")<=lim).length;
  d.ach=ACH.filter(a=>{try{return a.f(d)}catch(x){return false}}).map(a=>a.id);
  (P.achCustom||[]).forEach(a=>{const r=a.rule||{k:"manual"};let ok=false;if(r.k==="manual")ok=!!a.got&&a.got<=lim;else{const pr=ruleProgress(r,d);ok=!!pr&&pr[0]>=pr[1]}
    if(ok){d.ach.push(a.id);if(a.coins){d.coins+=a.coins;d.earned+=a.coins}}});
  return d;
}

function afterChange(){
  if(!S.profile)return;
  const d=derive();const P=S.profile;let changed=false;
  if(P.seenLevel==null||!P.seenSkills||!Array.isArray(P.seenAch)){P.seenLevel=d.level;P.seenSkills=Object.fromEntries(Object.entries(d.skills).map(([k,v])=>[k,v.level]));P.seenAch=d.ach.slice()} // тихая инициализация, не считается изменением
  else{
    if(d.level>P.seenLevel){celebrateQ.push({level:d.level,rank:rankOf(d.level),rankUp:rankOf(d.level)!==rankOf(P.seenLevel)});P.seenLevel=d.level;changed=true}
    activeSkills().forEach(s=>{const L=d.skills[s.id].level;if(L>(P.seenSkills[s.id]||0)){toast(s.name+": уровень "+L);P.seenSkills[s.id]=L;changed=true}});
    d.ach.forEach(a=>{if(!P.seenAch.includes(a)){const A=achAll().find(x=>x.id===a);if(A)setTimeout(()=>toast("ачивка: "+A.n),900);P.seenAch.push(a);changed=true}});
  }
  if(changed)Store.saveProfile();
  render(d);
  if(celebrateQ.length&&!document.querySelector(".lvlup"))showLevelUp(celebrateQ.shift());
}

function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));const m=v/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p}
function pathChart(d){
  const P=S.profile;const start=P.seasonStart;const t=today();
  const shown=Math.min(Math.max(7,diffDays(start,t)+1),P.seasonDays);
  const byDay={};d.done.forEach(e=>{if(e.date>=start)byDay[e.date]=(byDay[e.date]||0)+xpOf(e)});
  P.challenges.forEach(c=>{if(c.status==="done"&&c.doneAt)byDay[c.doneAt]=(byDay[c.doneAt]||0)+c.xp;if(c.status==="reviewed"&&c.doneAt)byDay[c.doneAt]=(byDay[c.doneAt]||0)+10});
  P.goals.forEach(g=>(g.steps||[]).forEach(s=>{if(s.done&&s.doneAt)byDay[s.doneAt]=(byDay[s.doneAt]||0)+40}));
  const series=[];let acc=0;for(let i=0;i<shown;i++){const dd=addDays(start,i);if(dd>t)break;acc+=byDay[dd]||0;series.push([i,acc])}
  const W=600,H=230,L=44,R=12,T=14,B=30;
  const step=niceStep(Math.max(100,acc)/4);const top=Math.ceil(Math.max(100,acc)/step)*step;
  const x=i=>L+(W-L-R)*(i/(shown-1||1)),y=v=>T+(H-T-B)*(1-v/top);
  let grid="";for(let v=0;v<=top;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const ticks=[0,Math.floor((shown-1)/2),shown-1].filter((v,i,a)=>a.indexOf(v)===i);
  const xl=ticks.map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===shown-1?"end":"middle"}">${fmtD(addDays(start,i))}</text>`).join("");
  const line=series.map(([i,v],k)=>(k?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const area=series.length?line+` L${x(series[series.length-1][0]).toFixed(1)} ${y(0)} L${x(0)} ${y(0)} Z`:"";
  const lp=series[series.length-1]||[0,0];
  const made=d.done.filter(e=>["create","ship","sell","teach"].includes(e.type)).length,watched=d.done.filter(e=>e.type==="learn").length,prac=d.done.filter(e=>["practice","try"].includes(e.type)).length,tot=made+watched+prac||1;
  const weeks=[];for(let w=0;w*7<shown;w++){let n=0;for(let k=0;k<7;k++){const dd=addDays(start,w*7+k);n+=d.done.filter(e=>e.date===dd).length}weeks.push(n)}
  const wmax=Math.max(1,...weeks);

  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="накопленный опыт за сезон: ${acc} xp">${grid}
  ${area?`<path d="${area}" fill="var(--accent)" fill-opacity=".14"/>`:""}${line?`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:""}
  <circle cx="${x(lp[0])}" cy="${y(lp[1])}" r="5.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2.5"/>${xl}</svg>
  <div class="small muted">сезон длится ${P.seasonDays} дней. сейчас ${acc} xp.</div></div>
  <div class="card" style="margin-top:10px"><div class="lbl">создаю или смотрю</div>
   <div class="ratio" aria-hidden="true"><i style="width:${made/tot*100}%;background:var(--accent)"></i><i style="width:${prac/tot*100}%;background:var(--navy)"></i><i style="width:${watched/tot*100}%;background:var(--line)"></i></div>
   <div class="row small" style="margin-top:8px;gap:14px"><span><b class="num">${made}</b> создал{а|}, выпустил{а|}, научил{а|}, продал{а|}</span><span><b class="num">${prac}</b> практика и новое</span><span><b class="num">${watched}</b> изучил{а|}</span></div></div>
  <div class="card" style="margin-top:10px"><div class="lbl">действий по неделям</div>
   <div style="display:grid;grid-template-columns:repeat(${weeks.length},1fr);gap:6px;align-items:end;height:90px;margin-top:10px">${weeks.map((n,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span class="small num" style="font-weight:600">${n}</span><i style="display:block;width:100%;max-width:34px;border-radius:6px;background:var(--accent);height:${Math.max(3,n/wmax*60)}px"></i><span class="small muted num">${i+1}</span></div>`).join("")}</div></div>`;
}
function pathCompare(d){

let assetsNs=null,sampleNs=null,downloadsNs=null;
const readURL=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)});
const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
async function pickImage(file){
  const u0=await readURL(file);const im=await loadImg(u0);const w=im.naturalWidth,h=im.naturalHeight;
  if(assetsNs){try{const r=await assetsNs.upload(file);return{id:r.id,url:r.url,w,h,px:50,py:50,z:1}}catch(x){}}
  const m=640,k=Math.min(1,m/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);return{url:c.toDataURL("image/jpeg",.68),w:c.width,h:c.height,px:50,py:50,z:1};
}
/* обложка с кадром: фото не режем, а храним масштаб и точку, и показываем через background */
function coverCSS(img,A,raw){
  if(!img||!img.url)return"";const u=raw?`background-image:url("${img.url}");background-repeat:no-repeat;`:`background-image:url(&quot;${esc(img.url)}&quot;);background-repeat:no-repeat;`;
  if(!img.w||!img.h)return u+"background-size:cover;background-position:center";
  const a=img.w/img.h,z=img.z||1;let bw,bh;if(a>A){bh=100;bw=a/A*100}else{bw=100;bh=A/a*100}
  return u+`background-size:${(bw*z).toFixed(2)}% ${(bh*z).toFixed(2)}%;background-position:${(img.px==null?50:img.px).toFixed(1)}% ${(img.py==null?50:img.py).toFixed(1)}%`;
}
function overlay(html,onMount){
  const o=document.createElement("div");o.className="shade";o.style.zIndex="60";
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${gx(html)}</div>`;document.body.appendChild(o);
  const close=()=>o.remove();if(onMount)onMount(o.querySelector(".sheet"),close);return close;
}
function cropper(img,A,cb){
  const c=Object.assign({px:50,py:50,z:1},img);
  overlay(`<div class="sheet-h"><h2>кадр</h2><button class="iconbtn" data-x="close" aria-label="закрыть">✕</button></div>
  <p class="small muted" style="margin:0 0 10px">двигай фото пальцем или мышкой, ползунком меняй масштаб.</p>
  <div class="cropbox" id="cropBox"></div>
  <div class="field"><label for="cropZ">масштаб</label><input type="range" id="cropZ" min="1" max="4" step="0.01" value="${c.z}"></div>
  <div class="row" style="margin-top:14px"><button class="btn accent" data-x="ok">готово</button><button class="btn ghost" data-x="reset">сбросить</button></div>`,(el,close)=>{
    const box=el.querySelector("#cropBox");const zi=el.querySelector("#cropZ");
    const paint=()=>{box.style.cssText=`aspect-ratio:${A};`+coverCSS(c,A,true)};paint();
    let dr=null;
    box.addEventListener("pointerdown",e=>{dr={x:e.clientX,y:e.clientY,px:c.px,py:c.py};try{box.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
    box.addEventListener("pointermove",e=>{if(!dr||!c.w)return;const W=box.clientWidth,H=box.clientHeight,a=c.w/c.h;let bw,bh;if(a>A){bh=H*c.z;bw=bh*a}else{bw=W*c.z;bh=bw/a}
      const ox=bw-W,oy=bh-H;if(ox>1)c.px=clamp(dr.px-(e.clientX-dr.x)/ox*100,0,100);if(oy>1)c.py=clamp(dr.py-(e.clientY-dr.y)/oy*100,0,100);paint()});
    const end=()=>{dr=null};box.addEventListener("pointerup",end);box.addEventListener("pointercancel",end);
    box.addEventListener("wheel",e=>{e.preventDefault();c.z=clamp(c.z-e.deltaY*0.002,1,4);zi.value=c.z;paint()},{passive:false});
    zi.oninput=()=>{c.z=+zi.value;paint()};
    el.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;const x=b.dataset.x;
      if(x==="close")close();
      if(x==="reset"){c.px=50;c.py=50;c.z=1;zi.value=1;paint()}
      if(x==="ok"){close();cb(c)}});
  });
}

function ruleText(r){
  r=r||{k:"manual"};const n=r.n||1;const sk=skillById(r.skill);const ty=TY[r.type];
  switch(r.k){
    case"manual":return"отмечаешь сам{а|}, когда получится";
    case"count":return n+" "+plural(n,"действие","действия","действий");
    case"type":return"«"+(ty?ty.label:"?")+"» "+n+" "+plural(n,"раз","раза","раз");
    case"skill":return n+" "+plural(n,"действие","действия","действий")+" в навыке «"+(sk?sk.name:"?")+"»";
    case"skillLvl":return"навык «"+(sk?sk.name:"?")+"» до "+n+" уровня";
    case"streak":return"серия "+n+" "+plural(n,"день","дня","дней")+" подряд";
    case"fear":return n+" "+plural(n,"шаг","шага","шагов")+" в страх";
    case"quests":return"закрыть "+n+" "+plural(n,"квест","квеста","квестов");
    case"level":return"уровень сезона "+n;
  }return"";
}
function ruleProgress(r,d){
  r=r||{k:"manual"};if(r.k==="manual")return null;const n=Math.max(1,r.n||1);let cur=0;
  switch(r.k){case"count":cur=d.done.length;break;case"type":cur=d.byType[r.type]||0;break;case"skill":cur=d.bySkill[r.skill]||0;break;

}

function suggestLocal(){
  const P=S.profile,d=derive();const act=activeSkills();if(!act.length){skillCatalog();return}
  const taken=new Set(P.challenges.filter(c=>c.status==="active").map(c=>c.title));
  const has=p=>P.challenges.some(c=>c.status==="active"&&c.period===p);
  const per=!has("week")?"week":!has("day")?"day":"month";
  const since=addDays(today(),-14);const recent={};d.done.filter(e=>e.date>=since).forEach(e=>{if(e.primary)recent[e.primary]=(recent[e.primary]||0)+xpOf(e)});
  const order=act.slice().sort((a,b)=>(recent[a.id]||0)-(recent[b.id]||0)||Math.random()-.5);
  for(const sk of order){const opts=ideaFor(sk.id,per).filter(x=>!taken.has(x.t));if(!opts.length)continue;
    const x=opts[Math.floor(Math.random()*opts.length)];
    const why=recent[sk.id]?"за две недели навык «"+sk.name+"» получил меньше всего опыта среди твоих навыков.":"за две недели в навыке «"+sk.name+"» не было ни одного действия.";
    x.about.reason=why+" "+PER_REASON[per];
    newQuest({title:x.t,about:x.about,period:per,skill:sk.id,auto:true});return}
  toast("все готовые идеи уже взяты, придумай свой квест");
}

let T=null;

  closeSheet();if(T)clearInterval(T.iv);

  T={i,base:live().length,iv:0,miss:0};tourShow();
}
function tourSkip(){S.profile.tourDone=true;Store.saveProfile();closeSheet();if(T)tourEnd()}
function tourEnd(){if(T)clearInterval(T.iv);const el=$("#tourEl");if(el)el.remove();T=null;S.profile.tourDone=true;Store.saveProfile()}
function tourGo(id){const i=TOUR.findIndex(s=>s.id===id);T.i=i<0?T.i:i;tourShow()}
function tourShow(state){
  const st=TOUR[T.i];clearInterval(T.iv);T.miss=0;T.scrolled=false;T.state=state||"";
  if(st.v&&S.view!==st.v){closeSheet();S.view=st.v;render();window.scrollTo(0,0)}
  let el=$("#tourEl");if(!el){el=document.createElement("div");el.id="tourEl";el.className="tour";document.body.appendChild(el)}
  const tapMode=!!st.tap&&T.state!=="done";const interactive=tapMode||st.free;
  const showNext=!tapMode;
  el.innerHTML=gx(`${interactive?'<div class="blk" data-b="t"></div><div class="blk" data-b="b"></div><div class="blk" data-b="l"></div><div class="blk" data-b="r"></div>':'<div class="blk" style="inset:0"></div>'}
  <div class="hole ${tapMode?"tap":""}"></div>

  <div class="small" id="tourMsg" style="color:var(--warn);font-weight:600;margin-top:6px"></div>
  ${showNext?`<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn sm accent" id="tourNextBtn">${T.i===TOUR.length-1?"готово":"дальше"}</button></div>`:""}</div>`);
  el.querySelector("#tourExit").onclick=()=>{tourEnd();closeSheet()};
  const nb=el.querySelector("#tourNextBtn");if(nb)nb.onclick=()=>{if(st.need&&!st.need()&&T.state!=="done"){el.querySelector("#tourMsg").textContent=st.needMsg||"";return}tourNext()};
  T.iv=setInterval(tourTick,150);tourTick();
}
function tourTick(){
  if(!T)return;const st=TOUR[T.i];const el=$("#tourEl");if(!el)return;
  if(T.state!=="done"){
    if(st.until&&st.until()){clearInterval(T.iv);if(st.done){tourShow("done")}else setTimeout(tourNext,350);return}
    if(st.back&&!$(".sheet")){tourGo(st.back);return}
  }
  const tg=document.querySelector(st.t);
  const hole=el.querySelector(".hole"),tip=el.querySelector(".tip");
  if(!tg){T.miss++;hole.classList.add("none");
    el.querySelectorAll(".blk[data-b]").forEach(b=>Object.assign(b.style,{left:0,top:0,width:"100%",height:"100%"}));
    if(T.miss>6&&!el.querySelector("#tourNextBtn")){const r=document.createElement("div");r.className="row";r.style.cssText="margin-top:12px;justify-content:flex-end";r.innerHTML='<button class="btn sm accent" id="tourNextBtn">дальше</button>';tip.appendChild(r);r.firstChild.onclick=tourNext}
    tip.style.top=Math.max(16,(innerHeight-tip.offsetHeight)/2)+"px";tip.style.left=Math.max(16,(innerWidth-tip.offsetWidth)/2)+"px";return}
  hole.classList.remove("none");
  if(!T.scrolled){T.scrolled=true;const r0=tg.getBoundingClientRect();if(r0.top<70||r0.bottom>innerHeight-90)tg.scrollIntoView({block:"center"})}
  const r=tg.getBoundingClientRect(),pd=6,vw=innerWidth,vh=innerHeight;
  const x=Math.max(4,r.left-pd),y=Math.max(4,r.top-pd),w=Math.max(0,Math.min(vw-4,r.right+pd)-x),h=Math.max(0,Math.min(vh-4,r.bottom+pd)-y);
  Object.assign(hole.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
  el.querySelectorAll(".blk[data-b]").forEach(b=>{const k=b.dataset.b;
    if(k==="t")Object.assign(b.style,{left:0,top:0,width:"100%",height:y+"px"});
    if(k==="b")Object.assign(b.style,{left:0,top:(y+h)+"px",width:"100%",height:Math.max(0,vh-y-h)+"px"});
    if(k==="l")Object.assign(b.style,{left:0,top:y+"px",width:x+"px",height:h+"px"});
    if(k==="r")Object.assign(b.style,{left:(x+w)+"px",top:y+"px",width:Math.max(0,vw-x-w)+"px",height:h+"px"});});
  const th=tip.offsetHeight,tw=tip.offsetWidth;const above=y-12,below=vh-(y+h)-12;let top;
  if(below>=th+8)top=y+h+12;else if(above>=th+8)top=y-12-th;else top=vh-th-90;
  tip.style.top=Math.max(8,top)+"px";tip.style.left=Math.min(vw-tw-16,Math.max(16,r.left+r.width/2-tw/2))+"px";
}
function tourNext(){if(!T)return;const st=TOUR[T.i];if(st.leave)st.leave();T.i++;if(T.i>=TOUR.length){tourEnd();S.view="home";render();window.scrollTo(0,0);finalSheet();return}tourShow()}

  if(f.dataset.form==="qabout"){ev.preventDefault();const c=S.profile.challenges.find(x=>x.id===f.dataset.id);if(!c)return;c.about=Object.assign({},c.about||{by:"me",reason:""},{essence:f.e.value.trim(),benefit:f.b.value.trim()});Store.saveProfile();render();questSheet(c.id);toast("пояснение сохранено");return}
  if(f.dataset.form==="qstep"){ev.preventDefault();const c=S.profile.challenges.find(x=>x.id===f.dataset.id);const t=f.t.value.trim();if(!c||!t){f.t.focus();return}c.steps=c.steps||[];c.steps.push({id:uid(),t,done:false});Store.saveProfile();render();questSheet(c.id);return}
  if(f.dataset.form!=="step")return;ev.preventDefault();
  const g=S.profile.goals.find(x=>x.id===f.dataset.g);const t=f.t.value.trim();if(!g||!t){f.t.focus();return}
  g.steps=g.steps||[];g.steps.push({id:uid(),t,done:false});Store.saveProfile();toast("шаг добавлен");afterChange();
});
document.addEventListener("change",ev=>{if(ev.target.id==="thenDate"){S.thenDate=ev.target.value||null;render()}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#layer").innerHTML&&!T)closeSheet()});
function applyTheme(t){if(!t){try{t=localStorage.getItem("prk-theme")}catch(x){}}t=t||"light";const r=document.documentElement;
  if(t==="system"){if(TG)r.setAttribute("data-theme",TG.colorScheme==="dark"?"dark":"light");else r.removeAttribute("data-theme")}else r.setAttribute("data-theme",t);
  paintThemeBtn();tgColors()}
function paintThemeBtn(){const b=document.getElementById("themeBtn");if(!b)return;const dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  b.innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  b.setAttribute("aria-label",dark?"включить светлую тему":"включить тёмную тему")}
function tgColors(){if(!TG)return;requestAnimationFrame(()=>{const rgb=getComputedStyle(document.body).backgroundColor.match(/\d+/g);if(!rgb)return;const hex="#"+rgb.slice(0,3).map(n=>(+n).toString(16).padStart(2,"0")).join("");
  try{TG.setHeaderColor(hex);TG.setBackgroundColor(hex);if(TG.setBottomBarColor)TG.setBottomBarColor(hex)}catch(x){}})}

/* ================= старт ================= */
if(TG){try{TG.ready();TG.expand();if(TG.disableVerticalSwipes)TG.disableVerticalSwipes();TG.onEvent("themeChanged",()=>applyTheme());TG.BackButton.onClick(()=>{if(T)return;const ov=[...document.querySelectorAll("body>.shade")].pop();if(ov){ov.remove();return}closeSheet()})}catch(x){}}
applyTheme();
const loc=Store.loadLocal();
S.profile=loc.p?normalize(loc.p):defaultProfile();
if(loc.p&&loc.p.v!==2)S.profile.upd=Date.now(); // переезд считается свежим изменением
S.entries=loc.e;
afterChange();
(async()=>{
  await Promise.race([Store.connect(),sleep(4000)]);
  setTimeout(()=>{if(T||$("#layer").innerHTML)return;if(!S.profile.tourDone)introSheet();else if(!S.profile.name||!S.profile.gender)meetSheet()},400);
})();
})();
</script>
