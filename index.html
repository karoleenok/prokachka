/* обложка с кадром: фото не режем, а храним масштаб и точку, и показываем через background */
function coverCSS(img,A,raw){
  if(!img||!img.url)return"";const u=raw?`background-image:url("${img.url}");background-repeat:no-repeat;`:`background-image:url(&quot;${esc(img.url)}&quot;);background-repeat:no-repeat;`;
  if(!img.w||!img.h)return u+"background-size:cover;background-position:center";
  const a=img.w/img.h,z=img.z||1;let bw,bh;if(a>A){bh=100;bw=a/A*100}else{bw=100;bh=A/a*100}
  return u+`background-size:${(bw*z).toFixed(2)}% ${(bh*z).toFixed(2)}%;background-position:${(img.px==null?50:img.px).toFixed(1)}% ${(img.py==null?50:img.py).toFixed(1)}%`;
}
function overlay(html,onMount){
  const o=document.createElement("div");o.className="shade";o.style.zIndex="60";
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${gx(html)}</div>`;document.body.appendChild(o);
  const close=()=>o.remove();if(onMount)onMount(o.querySelector(".sheet"),close);return close;
}
function cropper(img,A,cb){
  const c=Object.assign({px:50,py:50,z:1},img);
  overlay(`<div class="sheet-h"><h2>кадр</h2><button class="iconbtn" data-x="close" aria-label="закрыть">✕</button></div>
  <p class="small muted" style="margin:0 0 10px">двигай фото пальцем или мышкой, ползунком меняй масштаб.</p>
  <div class="cropbox" id="cropBox"></div>
  <div class="field"><label for="cropZ">масштаб</label><input type="range" id="cropZ" min="1" max="4" step="0.01" value="${c.z}"></div>
  <div class="row" style="margin-top:14px"><button class="btn accent" data-x="ok">готово</button><button class="btn ghost" data-x="reset">сбросить</button></div>`,(el,close)=>{
    const box=el.querySelector("#cropBox");const zi=el.querySelector("#cropZ");
    const paint=()=>{box.style.cssText=`aspect-ratio:${A};`+coverCSS(c,A,true)};paint();
    let dr=null;
    box.addEventListener("pointerdown",e=>{dr={x:e.clientX,y:e.clientY,px:c.px,py:c.py};try{box.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
    box.addEventListener("pointermove",e=>{if(!dr||!c.w)return;const W=box.clientWidth,H=box.clientHeight,a=c.w/c.h;let bw,bh;if(a>A){bh=H*c.z;bw=bh*a}else{bw=W*c.z;bh=bw/a}
      const ox=bw-W,oy=bh-H;if(ox>1)c.px=clamp(dr.px-(e.clientX-dr.x)/ox*100,0,100);if(oy>1)c.py=clamp(dr.py-(e.clientY-dr.y)/oy*100,0,100);paint()});
    const end=()=>{dr=null};box.addEventListener("pointerup",end);box.addEventListener("pointercancel",end);
    box.addEventListener("wheel",e=>{e.preventDefault();c.z=clamp(c.z-e.deltaY*0.002,1,4);zi.value=c.z;paint()},{passive:false});
    zi.oninput=()=>{c.z=+zi.value;paint()};
    el.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;const x=b.dataset.x;
      if(x==="close")close();
      if(x==="reset"){c.px=50;c.py=50;c.z=1;zi.value=1;paint()}
      if(x==="ok"){close();cb(c)}});
  });
}

function ruleText(r){
  r=r||{k:"manual"};const n=r.n||1;const sk=skillById(r.skill);const ty=TY[r.type];
  switch(r.k){
    case"manual":return"отмечаешь сам{а|}, когда получится";
    case"count":return n+" "+plural(n,"действие","действия","действий");
    case"type":return"«"+(ty?ty.label:"?")+"» "+n+" "+plural(n,"раз","раза","раз");
    case"skill":return n+" "+plural(n,"действие","действия","действий")+" в навыке «"+(sk?sk.name:"?")+"»";
    case"skillLvl":return"навык «"+(sk?sk.name:"?")+"» до "+n+" уровня";
    case"streak":return"серия "+n+" "+plural(n,"день","дня","дней")+" подряд";
    case"fear":return n+" "+plural(n,"шаг","шага","шагов")+" в страх";
    case"quests":return"закрыть "+n+" "+plural(n,"квест","квеста","квестов");
    case"level":return"уровень сезона "+n;
  }return"";
}
function ruleProgress(r,d){
  r=r||{k:"manual"};if(r.k==="manual")return null;const n=Math.max(1,r.n||1);let cur=0;
  switch(r.k){case"count":cur=d.done.length;break;case"type":cur=d.byType[r.type]||0;break;case"skill":cur=d.bySkill[r.skill]||0;break;

}

function suggestLocal(){
  const P=S.profile,d=derive();const act=activeSkills();if(!act.length){skillCatalog();return}
  const taken=new Set(P.challenges.filter(c=>c.status==="active").map(c=>c.title));
  const has=p=>P.challenges.some(c=>c.status==="active"&&c.period===p);
  const per=!has("week")?"week":!has("day")?"day":"month";
  const since=addDays(today(),-14);const recent={};d.done.filter(e=>e.date>=since).forEach(e=>{if(e.primary)recent[e.primary]=(recent[e.primary]||0)+xpOf(e)});
  const order=act.slice().sort((a,b)=>(recent[a.id]||0)-(recent[b.id]||0)||Math.random()-.5);
  for(const sk of order){const opts=ideaFor(sk.id,per).filter(x=>!taken.has(x.t));if(!opts.length)continue;
    const x=opts[Math.floor(Math.random()*opts.length)];
    const why=recent[sk.id]?"за две недели навык «"+sk.name+"» получил меньше всего опыта среди твоих навыков.":"за две недели в навыке «"+sk.name+"» не было ни одного действия.";
    x.about.reason=why+" "+PER_REASON[per];
    newQuest({title:x.t,about:x.about,period:per,skill:sk.id,auto:true});return}
  toast("все готовые идеи уже взяты, придумай свой квест");
}

async function backup(){
  const data=JSON.stringify({app:"prokachka",v:2,exported:new Date().toISOString(),profile:S.profile,entries:S.entries,hist:S.hist},null,1);
  const name="prokachka-"+today()+".json";
  if(downloadsNs){try{await downloadsNs.save({filename:name,data});S.profile.lastBackup=today();Store.saveProfile();toast("копия сохранена");return}catch(x){if(x&&x.code==="declined")return}}
  const box=$("#backupBox");if(!box){openSettings();return backup()}
  box.innerHTML=`<div class="field"><label for="bkTxt">скопируй текст и сохрани в файл ${name}</label><textarea class="in-text" id="bkTxt" readonly style="min-height:120px;font-size:12px">${esc(data)}</textarea><button class="btn sm" id="bkCopy">скопировать</button></div>`;
  $("#bkCopy").onclick=()=>{navigator.clipboard.writeText(data).then(()=>{toast("скопировано");S.profile.lastBackup=today();Store.saveProfile()}).catch(()=>{const t=$("#bkTxt");t.focus();t.select()})};
}
async function restore(data){
  S.entries.forEach(e=>{if(!e.del)Store.delEntry(e.id)});
  S.profile=normalize(data.profile);S.profile.fresh=false;Store.saveProfile();
  for(const e of data.entries){if(e&&e.id&&!e.del){const n=clone(e);Store.putEntry(n)}}
  afterChange();toast("копия загружена");
}

let T=null;

}
function tourSkip(){S.profile.tourDone=true;Store.saveProfile();closeSheet();if(T)tourEnd()}
function tourEnd(){if(T)clearInterval(T.iv);const el=$("#tourEl");if(el)el.remove();T=null;S.profile.tourDone=true;Store.saveProfile()}
function tourGo(id){const i=TOUR.findIndex(s=>s.id===id);T.i=i<0?T.i:i;tourShow()}
function tourShow(state){
  const st=TOUR[T.i];clearInterval(T.iv);T.miss=0;T.scrolled=false;T.state=state||"";
  if(st.id==="goals"&&S.qTab!=="goals"){S.qTab="goals";if(S.view==="quests")render()}if(st.id==="qa"&&S.qTab!=="mine"){S.qTab="mine";if(S.view==="quests")render()}

  let el=$("#tourEl");if(!el){el=document.createElement("div");el.id="tourEl";el.className="tour";document.body.appendChild(el)}
  const tapMode=!!st.tap&&T.state!=="done";const interactive=tapMode||st.free;
  const showNext=!tapMode;
  el.innerHTML=gx(`${interactive?'<div class="blk" data-b="t"></div><div class="blk" data-b="b"></div><div class="blk" data-b="l"></div><div class="blk" data-b="r"></div>':'<div class="blk" style="inset:0"></div>'}
  <div class="hole ${tapMode?"tap":""}"></div>
  <div class="tip" role="dialog" aria-live="polite"><div class="row" style="justify-content:space-between"><span class="small muted num">шаг ${T.i+1} из ${TOUR.length}</span><button class="link" id="tourExit">выйти из обучения</button></div>
  <h3>${esc(st.h)}</h3>${T.state==="done"?`<div class="ok">✓ ${esc(st.done||"получилось!")}</div>`:`<p>${esc(st.p)}</p>${tapMode?`<div class="do">→ ${esc(st.tap)}</div>`:""}`}
  <div class="small" id="tourMsg" style="color:var(--warn);font-weight:600;margin-top:6px"></div>
  ${showNext?`<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn sm accent" id="tourNextBtn">${T.i===TOUR.length-1?"готово":"дальше"}</button></div>`:""}</div>`);
  el.querySelector("#tourExit").onclick=()=>{tourEnd();closeSheet()};
  const nb=el.querySelector("#tourNextBtn");if(nb)nb.onclick=()=>{if(st.need&&!st.need()&&T.state!=="done"){el.querySelector("#tourMsg").textContent=st.needMsg||"";return}tourNext()};
  T.iv=setInterval(tourTick,150);tourTick();
}
function tourTick(){
  if(!T)return;const st=TOUR[T.i];const el=$("#tourEl");if(!el)return;
  if(T.state!=="done"){
    if(st.until&&st.until()){clearInterval(T.iv);if(st.done){tourShow("done")}else setTimeout(tourNext,350);return}
    if(st.back&&!$(".sheet")){tourGo(st.back);return}
  }
  const tg=document.querySelector(st.t);
  const hole=el.querySelector(".hole"),tip=el.querySelector(".tip");
  if(!tg){T.miss++;hole.classList.add("none");
    el.querySelectorAll(".blk[data-b]").forEach(b=>Object.assign(b.style,{left:0,top:0,width:"100%",height:"100%"}));
    if(T.miss>6&&!el.querySelector("#tourNextBtn")){const r=document.createElement("div");r.className="row";r.style.cssText="margin-top:12px;justify-content:flex-end";r.innerHTML='<button class="btn sm accent" id="tourNextBtn">дальше</button>';tip.appendChild(r);r.firstChild.onclick=tourNext}
    tip.style.top=Math.max(16,(innerHeight-tip.offsetHeight)/2)+"px";tip.style.left=Math.max(16,(innerWidth-tip.offsetWidth)/2)+"px";return}
  hole.classList.remove("none");
  if(!T.scrolled){T.scrolled=true;const r0=tg.getBoundingClientRect();if(r0.top<70||r0.bottom>innerHeight-90)tg.scrollIntoView({block:"center"})}
  const r=tg.getBoundingClientRect(),pd=6,vw=innerWidth,vh=innerHeight;
  const x=Math.max(4,r.left-pd),y=Math.max(4,r.top-pd),w=Math.max(0,Math.min(vw-4,r.right+pd)-x),h=Math.max(0,Math.min(vh-4,r.bottom+pd)-y);
  Object.assign(hole.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
  el.querySelectorAll(".blk[data-b]").forEach(b=>{const k=b.dataset.b;
    if(k==="t")Object.assign(b.style,{left:0,top:0,width:"100%",height:y+"px"});
    if(k==="b")Object.assign(b.style,{left:0,top:(y+h)+"px",width:"100%",height:Math.max(0,vh-y-h)+"px"});
    if(k==="l")Object.assign(b.style,{left:0,top:y+"px",width:x+"px",height:h+"px"});
    if(k==="r")Object.assign(b.style,{left:(x+w)+"px",top:y+"px",width:Math.max(0,vw-x-w)+"px",height:h+"px"});});
  const th=tip.offsetHeight,tw=tip.offsetWidth;const above=y-12,below=vh-(y+h)-12;let top;
  if(below>=th+8)top=y+h+12;else if(above>=th+8)top=y-12-th;else top=vh-th-90;
  tip.style.top=Math.max(8,top)+"px";tip.style.left=Math.min(vw-tw-16,Math.max(16,r.left+r.width/2-tw/2))+"px";
}
function tourNext(){if(!T)return;const st=TOUR[T.i];if(st.leave)st.leave();T.i++;if(T.i>=TOUR.length){tourEnd();S.view="home";render();window.scrollTo(0,0);finalSheet();return}tourShow()}

    case"achUnhide":Object.values(P.achEdit).forEach(x=>{delete x.hidden});Store.saveProfile();afterChange();break;
    case"achDel":{const a=(P.achCustom||[]).find(x=>x.id===id);if(!a)break;confirmSheet("удалить ачивку?","«"+a.n+"»","удалить",()=>{markGone(id);P.achCustom=P.achCustom.filter(x=>x.id!==id);Store.saveProfile();afterChange()});break}
    case"meet":meetSheet();break;
    case"rewardEdit":rewardForm(P.rewards.find(x=>x.id===id));break;
    case"settings":openSettings();break;
    case"ownerRef":ownerLoad();toast("обновляю");break;
    case"ownerOpen":try{TG.openLink(OWN.url)}catch(x){window.open(OWN.url,"_blank")}break;
    case"theme":try{localStorage.setItem("prk-theme",id)}catch(x){}applyTheme(id);document.querySelectorAll('[data-act="theme"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.id===id)));break;
    case"themeToggle":{const isDark=document.documentElement.getAttribute("data-theme")==="dark";const n=isDark?"light":"dark";try{localStorage.setItem("prk-theme",n)}catch(x){}applyTheme(n);break}
    case"backup":backup();break;
    case"grpTog":{S.grpOpen=S.grpOpen||{};S.grpOpen[id]=!S.grpOpen[id];try{localStorage.setItem("prk-grp",JSON.stringify(S.grpOpen))}catch(x){}render();break}
    case"skillCat":skillCatalog();break;
    case"sphere":sphereSheet(id);break;
    case"skSort":P.skSort=id;Store.saveProfile();render();break;
    case"sphTog":S.sphClosed=Object.assign({},S.sphClosed||{},{[id]:!(S.sphClosed||{})[id]});try{localStorage.setItem("prk-sphc",JSON.stringify(S.sphClosed))}catch(x){}render();break;
    case"skMenu":skMenuSheet(id);break;
    case"aiSkills":aiSkillsSheet();break;
    case"tqSkPick":tqSkSheet(b.dataset.q);break;
    case"skRename":skRenameSheet(id);break;
    case"skMerge":skMergeSheet(id);break;
    case"skUnmerge":closeSheet();doUnmerge(id);break;
    case"skPause":{closeSheet();const k=skillById(id);P.active=P.active.filter(x=>x!==id);P.paused=[...new Set((P.paused||[]).concat(id))];P.focus=(P.focus||[]).filter(x=>x!==id);Store.saveProfile();afterChange();toast("«"+(k?k.name:"навык")+"» на паузе, опыт сохранён");break}
    case"skUnpause":{P.paused=(P.paused||[]).filter(x=>x!==id);if(!P.active.includes(id))P.active.push(id);Store.saveProfile();afterChange();toast("навык снова в игре");break}
    case"goPortraitClose":closeSheet();S.view="skills";render();window.scrollTo(0,0);break;
    case"goPortrait":S.view="skills";render();window.scrollTo(0,0);break;
    case"catThenAdd":closeSheet();if(S.profile.active.length)openEntry(null,{});break;
    case"startLevels":openStartLevels();break;
    case"slDone":{closeSheet();const f=window._slDone;window._slDone=null;if(f)f();break}
    case"catAfter":{closeSheet();const f=window._catAfter;window._catAfter=null;if(f)f();break}
    case"profPick":profSheet(r=>{if(r!=="skip")render()});break;
    case"routineHelp":routineHelp();break;
    case"routineOwn":routineOwn();break;
    case"routineEdit":routineEdit();break;
    case"piggyAdd":S.view="rewards";render();setTimeout(()=>{const x=document.querySelector('[data-act="rewardNew"]');if(x)x.click()},50);break;
    case"wishStar":{const r=(P.rewards||[]).find(x=>x.id===id);if(r){r.goal=!r.goal;Store.saveProfile();toast(r.goal?"копишь на «"+r.title+"», она теперь на главной":"звёздочка снята");render()}break}
    case"routineQuick":{const tt=RT_LIST[+b.dataset.i];if(tt)routineAdd(tt,routineSkillFor(tt));break}
    case"routTog":S.routOpen=!S.routOpen;render();break;
    case"importPast":importPast();break;
    case"tourStart":tourStart();break;
    case"tourSkip":tourSkip();break;
    case"introGo":introGo();break;
    case"help":helpSheet();break;
    case"news":newsSheet();break;
    case"newsGo":newsMark([b.dataset.n]);newsGo(b.dataset.go);break;
    case"rules":rulesSheet();break;
    case"sync":syncSheet();break;
    case"allowCloud":allowCloud();break;
    case"tqNew":if(!Store.online()){toast("командные квесты работают, когда прокачка открыта через бота в телеграме");break}tqEditSheet(null);break;
    case"tqView":S.tqView=id;try{localStorage.setItem("prk-tqview",id)}catch(x){}{const sh=$("#layer .sheet");const y=sh?sh.scrollTop:0;tqSheet(b.dataset.q);const n=$("#layer .sheet");if(n)n.scrollTop=y}break;
    case"tqPlan":{const q=TQ.q(b.dataset.q);const t=q&&(q.tasks||[]).find(x=>x.id===b.dataset.id);if(!t)break;const sk=P.active[0];if(!sk){toast("сначала выбери навыки");break}
      if(!t.who){t.who=TQ.me();TQ.call("task",{qid:q.id,task:Object.assign({},t,{who:TQ.me(),upd:Date.now()})}).catch(()=>{})}
      Store.putEntry({id:uid(),date:today(),title:t.title,type:"create",primary:sk,secondary:[],planned:true,note:"задача командного квеста «"+q.title+"»",tref:{q:q.id,t:t.id}});
      toast("добавила на сегодня. отметишь, и задача закроется у всей команды");afterChange();break}
    case"calPick":{const qid=b.dataset.q;sheet(`<div class="sheet-h"><h2>в календарь</h2><button class="iconbtn" data-act="tqOpen" data-id="${esc(qid)}" aria-label="назад">✕</button></div><p class="small muted" style="margin:0 0 6px">${esc(b.dataset.t)} · ${esc(fmtD(b.dataset.d))}</p><div style="margin-top:8px">${calLinks(b.dataset.t,b.dataset.d,"")}</div><button class="btn ghost wide" style="margin-top:14px" data-act="tqOpen" data-id="${esc(qid)}">назад к квесту</button>`);break}
    case"qTab":if(b.dataset.go){S.view="quests";window.scrollTo(0,0)}S.qTab=id;try{localStorage.setItem("prk-qtab",id)}catch(x){}render();if(id==="team")TQ.load();break;
    case"tqOpen":tqSheet(b.dataset.id);TQ.load();break;
    case"tqEdit":tqEditSheet(b.dataset.q);break;
    case"tqTask":tqTaskSheet(b.dataset.q,b.dataset.id);break;
    case"tqDone":tqToggle(b.dataset.q,b.dataset.id);break;
    case"tqInvite":tqInvite(b.dataset.q);break;
    case"openUrl":{const u=b.dataset.url;try{if(TG&&TG.openLink)TG.openLink(u);else window.open(u,"_blank")}catch(x){window.open(u,"_blank")}break}
    case"tqStage":{const q=TQ.q(b.dataset.q);if(!q)break;const stages=(q.stages||[]).map(x=>x.id===b.dataset.id?Object.assign({},x,{done:!x.done}):x);TQ.call("save",{quest:Object.assign({},q,{stages})}).then(()=>tqRepaint()).catch(()=>toast("не получилось, проверь интернет"));break}
    case"tqTaskDel":{const q=TQ.q(b.dataset.q);const t=q&&(q.tasks||[]).find(x=>x.id===b.dataset.id);if(!t)break;confirmSheet("удалить задачу?","«"+t.title+"» пропадёт у всей команды.","удалить",()=>{TQ.call("task",{qid:q.id,task:Object.assign({},t,{del:true,upd:Date.now()})}).then(()=>{tqSheet(q.id);toast("задача удалена")}).catch(()=>toast("не получилось, проверь интернет"))});break}
    case"tqLeave":{const q=TQ.q(b.dataset.q);if(!q)break;confirmSheet("выйти из квеста?","«"+q.title+"» пропадёт у тебя, а команда получит уведомление. вернуться можно по ссылке-приглашению.","выйти",()=>{TQ.call("leave",{qid:q.id}).then(()=>{TQ.open=null;closeSheet();tqRepaint();toast("ты вышла из квеста")}).catch(()=>toast("не получилось, проверь интернет"))});break}
    case"syncNow":{b.disabled=true;b.textContent="синхронизирую…";Store.sync(true).then(()=>{toast(Store.status==="cloud"?"синхронизировала":"облако не ответило, попробую позже");syncSheet()});break}
    case"trash":trashSheet();break;
    case"restore":{const h=S.hist.find(x=>x.hid===b.dataset.id);if(h){const cur=S.entries.find(x=>x.id===h.id);const n=clone(h.prev);delete n.del;if(cur&&cur.upd)n.upd=cur.upd;Store.putEntry(n);afterChange();toast("вернула: "+String(n.title).slice(0,40)+(n.planned&&n.date<today()?" (в «раньше осталось»)":""))}trashSheet();break}
    case"verifyBot":{b.disabled=true;b.textContent="отправляю…";Store.sync(true).then(()=>fetch(BOT_API+"/verify",{method:"POST",headers:{"content-type":"text/plain"},body:JSON.stringify({initData:TG.initData,tz:-new Date().getTimezoneOffset(),date:today()})})).then(r=>r&&r.ok?r.json():null).then(j=>{toast(j&&j.ok?"отправила список в чат с ботом":"бот не ответил, попробуй ещё раз");closeSheet()}).catch(()=>{toast("бот не ответил, попробуй ещё раз");b.disabled=false;b.textContent="сверить задачи через бота"});break}
    case"retrySync":closeSheet();Store.ready?Store.sync(true):Store.connect();break;
    case"managePerms":managePerms();break;
  }
});
document.addEventListener("submit",ev=>{
  const f=ev.target;
  if(f.dataset.form==="qabout"){ev.preventDefault();const c=S.profile.challenges.find(x=>x.id===f.dataset.id);if(!c)return;c.about=Object.assign({},c.about||{by:"me",reason:""},{essence:f.e.value.trim(),benefit:f.b.value.trim()});Store.saveProfile();render();questSheet(c.id);toast("пояснение сохранено");return}
  if(f.dataset.form==="qstep"){ev.preventDefault();const c=S.profile.challenges.find(x=>x.id===f.dataset.id);const t=f.t.value.trim();if(!c||!t){f.t.focus();return}c.steps=c.steps||[];c.steps.push({id:uid(),t,done:false});Store.saveProfile();render();questSheet(c.id);return}
  if(f.dataset.form==="tqCmt"){ev.preventDefault();const t=f.t.value.trim();if(!t){f.t.focus();return}const btn=f.querySelector("button");btn.disabled=true;TQ.call("comment",{qid:f.dataset.q,tid:f.dataset.id,text:t}).then(()=>{tqTaskSheet(f.dataset.q,f.dataset.id);toast("отправила команде")}).catch(()=>{btn.disabled=false;toast("не получилось, проверь интернет")});return}
  if(f.dataset.form==="tqStage"){ev.preventDefault();const q=TQ.q(f.dataset.q);const t=f.t.value.trim();if(!q||!t){f.t.focus();return}const stages=(q.stages||[]).concat({id:uid(),title:t,deadline:f.d.value||"",done:false});TQ.call("save",{quest:Object.assign({},q,{stages})}).then(()=>{tqSheet(q.id);toast("этап добавлен")}).catch(()=>toast("не получилось, проверь интернет"));return}
  if(f.dataset.form!=="step")return;ev.preventDefault();
  const g=S.profile.goals.find(x=>x.id===f.dataset.g);const t=f.t.value.trim();if(!g||!t){f.t.focus();return}
  g.steps=g.steps||[];g.steps.push({id:uid(),t,done:false});Store.saveProfile();toast("шаг добавлен");afterChange();
});
document.addEventListener("change",ev=>{if(ev.target.id==="thenDate"){S.thenDate=ev.target.value||null;render()}});
/* навык подставляется сам: если такое дело уже записывала, берём навык и тип оттуда */
document.addEventListener("input",ev=>{
  if(ev.target.id!=="fTitle"||!F||F.skPicked)return;
  const v=ev.target.value.trim().toLowerCase();if(v.length<3)return;
  const m=live().filter(x=>x.title&&x.primary&&S.profile.active.includes(x.primary)&&x.type!=="bonus"&&x.title.toLowerCase().startsWith(v)).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
  if(m&&m.primary!==F.primary){F.primary=m.primary;F.autoSk=true;F.title=ev.target.value;try{paintForm()}catch(x){}}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#layer").innerHTML&&!T)closeSheet()});
function applyTheme(t){const rr=document.documentElement;if(S&&S._lv){rr.classList.add("tt");setTimeout(()=>rr.classList.remove("tt"),500)}if(!t){try{t=localStorage.getItem("prk-theme")}catch(x){}}t=t||"dark";const r=document.documentElement;
  if(t==="system"){if(TG)r.setAttribute("data-theme",TG.colorScheme==="dark"?"dark":"light");else r.removeAttribute("data-theme")}else r.setAttribute("data-theme",t);
  paintThemeBtn();tgColors()}
function paintThemeBtn(){const b=document.getElementById("themeBtn");if(!b)return;const dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  b.innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  b.setAttribute("aria-label",dark?"включить светлую тему":"включить тёмную тему")}
function tgColors(){if(!TG)return;requestAnimationFrame(()=>{const rgb=getComputedStyle(document.body).backgroundColor.match(/\d+/g);if(!rgb)return;const hex="#"+rgb.slice(0,3).map(n=>(+n).toString(16).padStart(2,"0")).join("");
  try{TG.setHeaderColor(hex);TG.setBackgroundColor(hex);if(TG.setBottomBarColor)TG.setBottomBarColor(hex)}catch(x){}})}

/* ================= старт ================= */
if(TG){try{TG.ready();TG.expand();if(TG.disableVerticalSwipes)TG.disableVerticalSwipes();TG.onEvent("themeChanged",()=>applyTheme());TG.BackButton.onClick(()=>{if(T)return;const ov=[...document.querySelectorAll("body>.shade")].pop();if(ov){ov.remove();return}closeSheet()})}catch(x){}}
applyTheme();
setTimeout(()=>pushSync(true),5000);
setTimeout(ownerLoad,2500);
setTimeout(newsLoad,1500);
{let nT=0;document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-nT>300000){nT=Date.now();newsLoad()}})}
try{if(TG&&TG.requestWriteAccess&&!localStorage.getItem("prk-wa")){localStorage.setItem("prk-wa","1");setTimeout(()=>{try{TG.requestWriteAccess(()=>{})}catch(x){}},6000)}}catch(x){}
const loc=Store.loadLocal();
S.profile=loc.p?normalize(loc.p):defaultProfile();
if(loc.p&&loc.p.v!==2)S.profile.upd=Date.now(); // переезд считается свежим изменением
S.entries=loc.e;
unpackImgs(S.profile);S.entries.forEach(unpackImgs);
afterChange();
(async()=>{
  await Promise.race([Store.connect(),sleep(4000)]);
  setTimeout(()=>{if(T||$("#layer").innerHTML)return;if(!S.profile.tourDone)introSheet();else if(!S.profile.name||!S.profile.gender)meetSheet()},400);
})();
})();
</script>
